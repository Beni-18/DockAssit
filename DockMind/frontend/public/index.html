<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to DockMind...</title>
  <script>
    // If the file is opened directly or via a static server (like Live Server),
    // automatically redirect to the active Vite development server on port 5173.
    if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
      window.location.href = "http://localhost:5173";
    }
  </script>
</head>
<body>
  <p>Redirecting to the running development server at <a href="http://localhost:5173">http://localhost:5173</a>...</p>
</body>
</html>
